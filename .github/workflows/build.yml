
name: Build CorePlus

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ordnerstruktur erstellen
        run: |
          mkdir -p src/main/java
          mkdir -p src/main/resources
          cp ./*.java src/main/java/
          cp plugin.yml config.yml src/main/resources/

      - name: Plugin bauen
        run: mvn -B clean package

      - name: JAR überprüfen
        run: |
          echo "Suche Plugin-JAR..."
          find target -maxdepth 1 -name "*.jar" -type f
          test -n "$(find target -maxdepth 1 -name "*.jar" -type f -print -quit)"

      - name: JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CorePlus
          path: target/*.jar
          if-no-files-found: error
